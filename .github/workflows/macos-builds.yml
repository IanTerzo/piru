name: macOS builds

# The iOS app and the Android APK compile only on macOS (Xcode; Skip's
# iOS-triple transpile phase). This workflow is how a Linux machine gets them:
# run it by hand, then download the artifacts. See "Working on Linux" in
# CONTRIBUTING.md.
#
#   gh workflow run macos-builds.yml -f android=true -f screenshots=true
#   gh run watch && gh run download
#
# It runs only on demand: the Android job alone downloads ~6 GB of toolchain.

on:
  workflow_dispatch:
    inputs:
      ios_tests:
        description: "Build the iOS app and run its tests (uploads the .xcresult)"
        type: boolean
        default: true
      screenshots:
        description: "Run pipeline/screenshots.py (piru skin, English) and upload the PNGs"
        type: boolean
        default: true
      android:
        description: "Build the Android APK (arm64-v8a)"
        type: boolean
        default: false
      android_config:
        description: "Android build configuration (release is left unsigned)"
        type: choice
        options: [debug, release]
        default: debug

permissions:
  contents: read

jobs:
  ios:
    name: iOS (tests + screenshots)
    if: inputs.ios_tests || inputs.screenshots
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Fetch the bundled substance DB
        run: pipeline/fetch-db.sh
      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      # The runner's simulators change with its image; take the newest iPhone
      # Pro Max it has rather than naming one that may not exist.
      - name: Pick a simulator
        id: sim
        run: |
          TYPE=$(xcrun simctl list devicetypes -j | python3 -c '
          import json, sys
          ids = [t["identifier"].rsplit(".", 1)[1] for t in json.load(sys.stdin)["devicetypes"]
                 if t["name"].startswith("iPhone") and t["name"].endswith("Pro Max")]
          print(ids[-1])
          ')
          UDID=$(xcrun simctl create "Piru CI" "com.apple.CoreSimulator.SimDeviceType.$TYPE")
          echo "type=$TYPE" >> "$GITHUB_OUTPUT"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Build & test
        if: inputs.ios_tests
        run: |
          set -o pipefail
          xcodebuild -scheme Piru -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath "$RUNNER_TEMP/Piru.xcresult" test 2>&1 \
            | tee "$RUNNER_TEMP/xcodebuild.log" | tail -40 \
            || { grep -E "(error|fatal error): " "$RUNNER_TEMP/xcodebuild.log" | sort -u | head -60; exit 1; }
      - name: Screenshots
        if: inputs.screenshots && !cancelled()
        run: |
          pipeline/screenshots.py --skins none --locales en \
            --device "Piru Screenshots" --device-type "${{ steps.sim.outputs.type }}"
      - uses: actions/upload-artifact@v4
        if: inputs.ios_tests && !cancelled()
        with:
          name: ios-test-results
          path: |
            ${{ runner.temp }}/Piru.xcresult
            ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: inputs.screenshots && !cancelled()
        with:
          name: ios-screenshots
          path: Store/shots
          if-no-files-found: ignore

  android:
    name: Android APK
    if: inputs.android
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      # Must match the vendored skip/skipstone tag android/tools/setup.sh checks.
      SKIP_VERSION: 1.9.13
      SKIP_SHA256: 8a0242c19a65e3cb0c1af0cbceb79a7294bd545b47748c007c0a69dc41c9bfdc
      PIRU_ANDROID: ${{ github.workspace }}/../piru-android
      PIRU_CONFIG: ${{ inputs.android_config }}
      PIRU_UNSIGNED: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Fetch the bundled substance DB
        run: pipeline/fetch-db.sh
      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Host tools
        run: |
          brew install gradle librsvg trash
          python3 -m pip install pillow
      # brew serves whichever skip is current; setup.sh insists on the vendored tag.
      - name: Install skip ${{ env.SKIP_VERSION }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/skip.zip" "https://github.com/skiptools/skip/releases/download/${SKIP_VERSION}/skip-macos.zip"
          echo "$SKIP_SHA256  $RUNNER_TEMP/skip.zip" | shasum -a 256 -c -
          unzip -q -o "$RUNNER_TEMP/skip.zip" -d "$RUNNER_TEMP/skip"
          echo "$RUNNER_TEMP/skip/skip.artifactbundle/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: ${{ env.PIRU_ANDROID }}/downloads
          key: piru-android-downloads-${{ hashFiles('android/tools/setup.sh', 'android/tools/env.sh') }}
      - name: Toolchain (android/tools/setup.sh)
        run: android/tools/setup.sh
      - name: Stage + compile (android/tools/build-app.sh)
        run: android/tools/build-app.sh
      - name: Package (android/tools/package-apk.sh)
        run: android/tools/package-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: piru-android-${{ inputs.android_config }}
          path: ${{ env.PIRU_ANDROID }}/stage/.build/Android/app/outputs/apk/${{ inputs.android_config }}/*.apk
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-build-logs
          path: |
            ${{ env.PIRU_ANDROID }}/build/*.log
            ${{ env.PIRU_ANDROID }}/build/app.errors
          if-no-files-found: ignore
